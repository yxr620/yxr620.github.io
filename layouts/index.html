{{- define "main" }}
<article class="cv-page">
    <header class="cv-header">
        {{- if .Title }}
        <h1>{{ .Title }}</h1>
        {{- end }}
        {{- if .Description }}
        <p class="cv-subtitle">{{ .Description | markdownify }}</p>
        {{- end }}
        <nav class="cv-quick-links">
            <a href="mailto:yxr620@gmail.com">yxr620@gmail.com</a>
            <span class="cv-ql-sep">/</span>
            <a href="https://github.com/yxr620" target="_blank" rel="noopener noreferrer">GitHub</a>
            <span class="cv-ql-sep">/</span>
            <a href="/blog/">Blog</a>
            <span class="cv-ql-sep">/</span>
            <a href="#academic-papers">Papers</a>
        </nav>
    </header>

    <div class="cv-content post-content">
        {{ .Content }}
    </div>
</article>
{{- end }}
